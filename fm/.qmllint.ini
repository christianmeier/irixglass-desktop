; qmllint settings for fm's QML (qmllint looks for this file next to the files and in their parents).
; CI: .github/workflows/lint.yml runs `qmllint fm/qml/*.qml`. Per-line exceptions use
; `// qmllint disable <category> (reason)` in the QML.
[General]
DisableDefaultImports=false
MaxWarnings=0
Warnings=warning

[Warnings]
; fm's parts read the window's properties and the C++ singletons (Fm, Kio) through QML's
; dynamic scope; qmllint can't see the C++ types (registered at run time, no qmltypes), so it
; reports every such access.
UnqualifiedAccess=disable
UnusedImports=info
