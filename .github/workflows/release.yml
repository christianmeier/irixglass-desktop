# Release: build, test, lint and scan a commit, then tag it and publish a GitHub Release.
#
# Two ways to start it (both release only from a green pipeline):
#   1. Actions > Release > Run workflow (branch main), version blank = the VERSION file.
#      The tag v<version> must not exist yet; the release creates it on the tested commit.
#   2. git tag v0.2.0 && git push origin v0.2.0   (the tag must point at a commit on main)
# Either way VERSION is the source of truth: bump it (and CHANGELOG.md) in a normal commit first.
# The workflow never commits. Assets come from packaging/make-release.sh, which runs locally too.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.2.0 (blank: the VERSION file)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as pre-release (versions with -rc.1 etc. always are)"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel one half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || fail "run the release from main, not $GITHUB_REF"
            v="${INPUT_VERSION#v}"
            [[ -n "$v" ]] || v="$(tr -d '[:space:]' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              fail "tag v$v already exists: bump VERSION, or re-run the release from the tag"
            fi
          else
            v="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "tag $GITHUB_REF_NAME is not on main"
          fi
          packaging/make-release.sh --check --ref "$GITHUB_SHA" "$v" || fail "version $v doesn't match VERSION"
          pre=false
          [[ "$INPUT_PRERELEASE" == true || "$v" == *-* ]] && pre=true
          {
            echo "version=$v"
            echo "tag=v$v"
            echo "sha=$GITHUB_SHA"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "### Release v$v (${GITHUB_SHA:0:12}, pre-release: $pre)" >> "$GITHUB_STEP_SUMMARY"

  # The same pipeline as on every push; a release needs all of it green.
  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  lint:
    name: Lint
    needs: prepare
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  security:
    name: Security
    needs: prepare
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write   # SARIF upload, if security.yml does one
      actions: read

  build:
    name: Build release assets
    needs: [prepare, ci, lint, security]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0   # tags and history for the release notes
          persist-credentials: false
      - name: Download fm built and tested by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fm-build-x86_64
          path: ${{ runner.temp }}/fm-build
      - name: Build assets
        env:
          FM_BUILD: ${{ runner.temp }}/fm-build
        run: |
          bin="$(find "$FM_BUILD" -type f -name irixfm | head -1)"
          [[ -n "$bin" ]] || { echo "::error::no irixfm in the fm-build-x86_64 artifact"; exit 1; }
          chmod +x "$bin"
          packaging/make-release.sh --binary "$bin" --ref "$SHA" "$VERSION" dist
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release; only this job can write
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          args=(--title "IrixGlass desktop $VERSION" --notes-file release-notes.md)
          if [[ "$EVENT" == push ]]; then
            args+=(--verify-tag)            # the pushed tag
          else
            args+=(--target "$SHA")         # creates the tag on the tested commit
          fi
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease --latest=false)
          gh release create "$TAG" "${args[@]}" \
            irixglass-desktop-"$VERSION".tar.gz irixfm-"$VERSION"-x86_64.tar.zst \
            irixglass-theme-"$VERSION".tar.zst PKGBUILD SHA256SUMS
          echo "Published $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
