# IrixGlass flags for Chromium (Arch). Install as ~/.config/chromium-flags.conf.
# /usr/bin/chromium reads this file at every start: one flag per line, '#' lines skipped,
# no ~ or $HOME expansion, so paths must be absolute. Checked on Chromium 156.0.8078.73.

# Not loaded: the IrixGlass theme (configs/chromium/irixglass-theme). Any theme switches Chromium out
# of GTK mode, and only GTK mode draws our window controls (theme/gen-gtk.py chromium_css()); GTK mode
# already gives the glass colours. Use it only with the KWin title bar (custom_chrome_frame false),
# loaded from a COPY outside the repo (Chromium writes "Cached Theme.pak" into the folder it loads):
# --load-extension=/home/christianmeier/.local/share/irixglass/chromium-theme

# Exact colours: with Wayland colour management (wp_color_manager_v1) Chromium tags its output
# as sRGB and KWin re-encodes it, which lifts dark tones (#1e2029 showed as #23252d, next to
# Firefox/fm at the exact #1e2029). Without it, Chromium matches every other window here.
--disable-features=WaylandWpColorManagerV1

# macOS-style overlay scrollbars on web pages (thin, fade out; no grey track with arrows).
# Only one --enable-features line: when there are several, only the last one counts.
--enable-features=OverlayScrollbar:mode/overlay
