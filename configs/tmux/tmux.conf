# Prefix: Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits (open in the current pane's directory)
unbind '"'
unbind %
bind '"' split-window -v -c "#{pane_current_path}"   # horizontal split (top/bottom)
bind % split-window -h -c "#{pane_current_path}"     # vertical split (left/right)

# Always the login shell (fish), even when the tmux server is started from another shell
set -g default-shell /usr/bin/fish

# True color (Alacritty)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Nord theme (matches Alacritty)
set -g status-position bottom
set -g status-style "bg=#3B4252,fg=#D8DEE9"
set -g status-left-length 30
set -g status-left "#[bg=#88C0D0,fg=#2E3440,bold] #S #[bg=#3B4252] "
set -g status-right "#[fg=#D8DEE9] %Y-%m-%d #[fg=#4C566A]│#[fg=#D8DEE9] %H:%M #[bg=#81A1C1,fg=#2E3440,bold] #H "
set -g window-status-format "#[fg=#D8DEE9] #I:#W "
set -g window-status-current-format "#[bg=#5E81AC,fg=#ECEFF4,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"
set -g message-style "bg=#434C5E,fg=#ECEFF4"
set -g message-command-style "bg=#434C5E,fg=#ECEFF4"
set -g mode-style "bg=#4C566A,fg=#ECEFF4"
set -g display-panes-active-colour "#88C0D0"
set -g display-panes-colour "#4C566A"
set -g clock-mode-colour "#88C0D0"

# Mouse: click to select panes/windows, drag borders to resize, wheel to scroll
set -g mouse on
# Send copied text to the system clipboard via the terminal (OSC 52)
set -g set-clipboard on
